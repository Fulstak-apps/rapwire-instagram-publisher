name: RapWire 24/7 monitor and publisher

on:
  push:
    branches: [main]
    paths-ignore:
      - "queue/**"
      - "media/**"
      - "logs/**"
      - "monitor/**"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: rapwire-instagram-publisher
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test resumable publisher
        run: node --test scripts/*.test.mjs

      - name: Check prior publication state
        id: state_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-publication-state.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test local editor safety gates
        # Local editor checks are offline and do not call Ollama or Meta.
        run: python -m unittest discover -s scripts -p 'test_local_rapwire*.py'

      - name: Remove stale queue items
        run: python scripts/expire-stale-queue.py

      - name: Validate approved media formats
        run: node scripts/block-non-ai.mjs

      - name: Hold duplicate queue entries
        run: node scripts/dedupe-queue.mjs

      - name: Save validated queue state
        run: |
          if [ -z "$(git status --porcelain -- queue media)" ]; then
            echo "No queue/media changes."
            exit 0
          fi
          git config user.name "RapWire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add queue media
          git commit -m "Save validated RapWire queue"
          git pull --rebase origin main
          git push

      - name: Check Instagram auth recovery state
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/instagram-auth-state.mjs

      - name: Wait for public media propagation
        run: sleep 10

      - name: Publish queued post to Instagram feed, Threads and RapWire Facebook
        env:
          RAPWIRE_BRAND: "24/7"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          # RapWire-specific Facebook secrets intentionally do not reuse the
          # old generic Facebook secrets that previously targeted Darnell's page.
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.RAPWIRE_FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.RAPWIRE_FACEBOOK_PAGE_ID }}
          PUBLISH_INSTAGRAM_STORIES: "true"
          MAX_FEED_POSTS_PER_RUN: "1"
        run: node scripts/publish-instagram.mjs

      - name: Engage substantive Threads replies
        if: ${{ !cancelled() && steps.state_check.outcome == 'success' }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node scripts/threads-engage.mjs

      - name: Publish hourly RapWire Threads conversation
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          RAPWIRE_HOURLY_THREADS_STATE: logs/hourly-threads.json
        run: node scripts/hourly-threads.mjs

      - name: Measure audience growth
        if: ${{ !cancelled() && steps.state_check.outcome == 'success' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node scripts/growth-feedback.mjs

      - name: Prepare evidence-based newsroom inbox
        if: ${{ !cancelled() && steps.state_check.outcome == 'success' }}
        run: node scripts/editorial-inbox.mjs

      - name: Save publication log
        if: ${{ always() }}
        run: bash scripts/save-publication-state.sh

      - name: Preserve recoverable publication state
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-state-${{ github.run_id }}
          path: |
            queue/*.json
            logs/*.json
            logs/publish-attempts.jsonl
          retention-days: 7

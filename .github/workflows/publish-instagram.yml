name: RapWire 24/7 monitor and publisher

on:
  push:
    branches: [main]
    paths-ignore:
      - "queue/**"
      - "media/**"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rapwire-instagram-publisher
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Remove stale queue items
        run: python scripts/expire-stale-queue.py

      - name: Validate approved media formats
        run: node scripts/block-non-ai.mjs

      - name: Save validated queue state
        run: |
          if [ -z "$(git status --porcelain -- queue media)" ]; then
            echo "No queue/media changes."
            exit 0
          fi
          git config user.name "RapWire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add queue media
          git commit -m "Save validated RapWire queue"
          git pull --rebase origin main
          git push

      - name: Wait for public media propagation
        run: sleep 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Publish queued post to Instagram, Story, and Threads
        env:
          RAPWIRE_BRAND: "24/7"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PUBLISH_INSTAGRAM_STORIES: "true"
          MAX_FEED_POSTS_PER_RUN: "1"
        run: node scripts/publish-instagram.mjs

      - name: Save publication log
        if: ${{ always() }}
        run: |
          if [ -z "$(git status --porcelain -- queue logs)" ]; then exit 0; fi
          git config user.name "RapWire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add -- queue logs
          git commit -m "Log RapWire publication" || true
          git pull --rebase origin main || true
          git push || true

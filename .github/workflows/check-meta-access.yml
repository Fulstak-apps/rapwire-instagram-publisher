name: Check Meta access
on:
  workflow_dispatch:
  # Catch revoked or expired credentials before the next scheduled post. A
  # failed scheduled workflow also sends GitHub's configured failure notice.
  schedule:
    - cron: '17 15 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/check-meta-access.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/check-meta-access.mjs --require-valid
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

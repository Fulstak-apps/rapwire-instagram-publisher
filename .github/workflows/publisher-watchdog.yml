name: RapWire publisher watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  # The report is persisted so the next watchdog run and daily summary can
  # see the last decision.  A failed report push is non-blocking below.
  contents: write
  actions: write

concurrency:
  group: rapwire-publisher-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main
          filter: blob:none
          sparse-checkout: |
            scripts
            logs
            queue
            package.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test watchdog decision logic
        run: node --test scripts/publisher-watchdog.test.mjs

      - name: Evaluate publisher health
        id: health
        run: node scripts/publisher-watchdog.mjs

      - name: Redispatch one safe publisher run
        if: steps.health.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(timeout 45s gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-instagram.yml --limit 20 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting")] | length')
          if [ "$active" != "0" ]; then
            echo "Publisher already has an active run; watchdog will check again next cycle."
            exit 0
          fi
          timeout 45s gh workflow run publish-instagram.yml --ref main

      - name: Persist watchdog report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- logs/publisher-watchdog.json)" ]; then
            echo "No watchdog report changes."
            exit 0
          fi
          git config user.name "RapWire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add logs/publisher-watchdog.json
          git commit -m "Save RapWire watchdog report"
          # The publisher and watchdog can both move main.  Retry this
          # observability commit without ever blocking the redispatch decision.
          for attempt in 1 2 3; do
            if timeout 45s git pull --rebase origin main && timeout 45s git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$attempt" != "3" ]; then sleep "$((attempt * 5))"; fi
          done
          echo "Watchdog report could not be persisted this cycle; next cycle will retry." >&2

      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-${{ github.run_id }}
          path: logs/publisher-watchdog.json
          retention-days: 14

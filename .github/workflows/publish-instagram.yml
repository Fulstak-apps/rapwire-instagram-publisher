name: RapWire 24/7 monitor and publisher

on:
  push:
    branches: [main]
    paths-ignore:
      - "queue/**"
      - "media/**"
  workflow_dispatch:
    inputs:
      run_ai_newsroom:
        description: "Run the AI newsroom for researched news/court explainers"
        required: false
        default: "false"
  schedule:
    - cron: "* * * * *"

permissions:
  contents: write

concurrency:
  group: rapwire-instagram-publisher
  cancel-in-progress: false

env:
  NARRO_RSS_URL: "https://rss.narro.info/e4f36406-0664-4e77-b672-7e0682966a9f"
  MAX_NEW_ITEMS: "12"
  MAX_SOURCE_AGE_HOURS: "48"

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set AI newsroom cadence
        id: cadence
        env:
          RUN_AI_NEWSROOM_INPUT: ${{ inputs.run_ai_newsroom || 'false' }}
        run: |
          if [ "$RUN_AI_NEWSROOM_INPUT" = "true" ]; then
            echo "run_ai_newsroom=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_ai_newsroom=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_utc="$(date -u +'%H:%M')"
          case "$current_utc" in
            "16:00"|"19:00"|"00:00") echo "run_ai_newsroom=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run_ai_newsroom=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install AI publisher dependencies
        if: ${{ steps.cadence.outputs.run_ai_newsroom == 'true' }}
        run: python -m pip install --disable-pip-version-check pillow openai

      - name: Pull all fresh Narro stories and let AI choose one
        if: ${{ steps.cadence.outputs.run_ai_newsroom == 'true' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai-rapwire.py

      - name: Remove stale queue items
        run: python scripts/expire-stale-queue.py

      - name: Block every legacy/non-AI graphic
        run: node scripts/block-non-ai.mjs

      - name: Commit AI assets and queue state
        run: |
          if [ -z "$(git status --porcelain -- queue media)" ]; then
            echo "No queue/media changes."
            exit 0
          fi
          git config user.name "RapWire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add queue media
          git commit -m "Enforce AI-only RapWire visual pipeline"
          git pull --rebase origin main
          git push

      - name: Wait for public media propagation
        run: sleep 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Publish next AI-ready RapWire story
        env:
          RAPWIRE_BRAND: "24/7"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PUBLISH_INSTAGRAM_STORIES: "true"
          MAX_FEED_POSTS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && '3' || '1' }}
        run: node scripts/publish-instagram.mjs

      - name: Save publication log
        if: ${{ always() }}
        run: |
          if [ -z "$(git status --porcelain -- queue logs)" ]; then exit 0; fi
          git config user.name "RapWire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add -- queue logs
          git commit -m "Log RapWire publication" || true
          git pull --rebase origin main || true
          git push || true

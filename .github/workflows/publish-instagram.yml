name: RapWire 24/7 monitor and publisher

on:
  # Queue/media commits are deliberately ignored below to avoid an upload for
  # every collector write.  This small heartbeat makes those queued items
  # eligible without relying on a local machine staying awake; the publisher
  # still enforces its independent 30-minute platform cadence.
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "queue/**"
      - "media/**"
      - "logs/**"
      - "monitor/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: rapwire-instagram-publisher
  # Never cancel a run after Meta has accepted a container. Cancellation in
  # the handoff between media_publish and the state-save step can leave a real
  # Instagram/Threads post with no durable media ID, forcing the next run into
  # a safety hold. A queued run is cheap; an uncertain publication is not.
  # The watchdog already counts queued/pending runs and avoids duplicates.
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Publishing uses immutable raw-GitHub media URLs, so the runner only
          # needs queue, scripts, and state. Keeping media out makes each cycle fast.
          fetch-depth: 1
          sparse-checkout: |
            .github
            scripts
            queue
            logs
            monitor
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test resumable publisher
        run: node --test scripts/container-state.test.mjs scripts/publisher.integration.test.mjs scripts/video-caption.test.mjs scripts/media-ranges.test.mjs scripts/publication-policy.test.mjs

      - name: Test X mirror isolation and backfill
        run: node --test scripts/x-threads-mirror.test.mjs

      - name: Check prior publication state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-publication-state.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Remove stale queue items
        run: python scripts/expire-stale-queue.py

      - name: Validate approved media formats
        run: node scripts/block-non-ai.mjs

      - name: Hold duplicate queue entries
        run: node scripts/dedupe-queue.mjs

      - name: Save validated queue state
        run: |
          if [ -z "$(git status --porcelain -- queue)" ]; then
            echo "No queue changes."
            exit 0
          fi
          git config user.name "RapWire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add queue
          git commit -m "Save validated RapWire queue"
          # The local Chrome collector may push a newly captured item while
          # this runner is validating the queue. Rebase/push races are normal;
          # retry them instead of turning one race into a red run and a stalled
          # publication lane.
          for attempt in 1 2 3 4 5; do
            if timeout 60s git pull --rebase origin main && timeout 60s git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$attempt" = "5" ]; then
              echo "Queue state push failed after five bounded retries." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Wait for public media propagation
        # Raw GitHub can take longer than ten seconds to serve a just-pushed
        # MP4. Give Meta a little propagation headroom without consuming the
        # whole 15-minute job budget.
        run: sleep 20

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Publish queued post to Instagram and Threads
        env:
          RAPWIRE_BRAND: "24/7"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          # Facebook is delivered through the user's Meta Instagram cross-posting.
          # Do not also attempt direct publication with the expired Page token.
          PUBLISH_INSTAGRAM_STORIES: "false"
          MAX_FEED_POSTS_PER_RUN: "1"
          RAPWIRE_SKIP_PACING_GUARD: "1"
        run: node scripts/publish-instagram.mjs

      - name: Remove confirmed published media from repository
        if: ${{ always() }}
        run: python scripts/cleanup-published-media.py

      - name: Mirror RapWikip to Threads only
        if: ${{ success() && vars.RAPWIRE_X_MIRROR_ENABLED == 'true' }}
        timeout-minutes: 3
        env:
          RAPWIRE_X_MIRROR_ENABLED: "true"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/x-threads-mirror.mjs

      - name: Save publication log
        if: ${{ always() }}
        run: bash scripts/save-publication-state.sh

      - name: Preserve recoverable publication state
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-state-${{ github.run_id }}
          path: |
            queue/*.json
            logs/*.json
            logs/publish-attempts.jsonl
          retention-days: 7

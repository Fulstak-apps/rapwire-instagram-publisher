name: Publish RapWire Instagram queue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "queue/**"
      - "media/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/publish-instagram.yml"
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: rapwire-instagram-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Publish every ready carousel
        env:
          RAPWIRE_BRAND: "24/7"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: npm run publish
      - name: Save publication log
        run: |
          if git diff --quiet -- queue; then exit 0; fi
          git config user.name "RapWire Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -- queue
          git commit -m "Log published Instagram posts"
          git push
